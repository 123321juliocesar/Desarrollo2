version: "3.9"

services:
  backend:
    image: backend-ecommerce
    build: .
    container_name: backend-ecommerce
    ports:
      - "10000:8080"
    environment:
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_MODE: sandbox
      SERVER_PORT: 8080

