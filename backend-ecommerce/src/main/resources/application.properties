spring.application.name=ecommerce

# ==============================================================
# CONFIGURACIÓN SUPABASE (CORREGIDA - US WEST 2) -- SUPABASE ---
# ==============================================================

# SE AGREGO: &prepareThreshold=0 al final.
# Esto es vital para que Hibernate no falle con el "Transaction Pooler" de Supabase.
spring.datasource.url=jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0

spring.datasource.username=postgres.wvmroznvsflbdutryhaa
spring.datasource.password=123123123
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# CONFIGURACIÓN JPA / HIBERNATE
# ==============================================================

# IMPORTANTE: Mantener 'none' porque usaste el script SQL manual.
spring.jpa.hibernate.ddl-auto=none

# Mostrar SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ESTRATEGIA DE NOMBRES (Vital para tus tablas con comillas como "tUser")
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# RECOMENDACIÓN EXTRA:
# Evita que la conexión siga abierta mientras se renderiza la vista (mejora rendimiento)
spring.jpa.open-in-view=false

# ==============================================================
# POOL DE CONEXIONES (HikariCP)
# ==============================================================
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000