spring.application.name=ecommerce

# ==============================================================
# CONFIGURACION SUPABASE (US WEST 2)
# ==============================================================

# IMPORTANTE:
# Se agrego &prepareThreshold=0 para evitar errores con
# el Transaction Pooler de Supabase y Hibernate
spring.datasource.url=jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0

spring.datasource.username=postgres.wvmroznvsflbdutryhaa
spring.datasource.password=123123123
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# CONFIGURACION JPA / HIBERNATE
# ==============================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.open-in-view=false

# ==============================================================
# HIKARI CONNECTION POOL
# ==============================================================

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

paypal.client.id=${PAYPAL_CLIENT_ID}
paypal.client.secret=${PAYPAL_CLIENT_SECRET}
paypal.mode=${PAYPAL_MODE:sandbox}

server.port=${PORT:8080}


