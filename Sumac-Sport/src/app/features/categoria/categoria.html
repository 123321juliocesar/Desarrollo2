<div class="catalog-header">
  <h2>Categorías</h2>
  <p *ngIf="listarProductos.length > 0">{{ listarProductos.length }} productos encontrados</p>
</div>

<div class="categoria-container">
  <!-- Sidebar con filtros -->
  <aside class="filters-sidebar">
    <app-product-filters (filtersChange)="onFiltersChange($event)"></app-product-filters>
  </aside>

  <!-- Área principal con productos -->
  <main class="products-main">
    <div class="productos-container">
      <app-product-card *ngFor="let producto of listarProductos" [product]="producto"
        (productClick)="onProductClick($event)" (addToCart)="onAddToCart($event)"></app-product-card>
    </div>

    <div *ngIf="listarProductos.length === 0" class="no-products">
      <p>No se encontraron productos con los filtros seleccionados.</p>
    </div>
  </main>
</div>
