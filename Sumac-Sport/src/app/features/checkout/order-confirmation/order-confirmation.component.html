<div class="container py-5 text-center">
  <div *ngIf="loading" class="py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Procesando...</span>
    </div>
    <p class="mt-3 text-muted">Confirmando tu pago...</p>
  </div>

  <div *ngIf="!loading && success" class="py-5 fade-in">
    <div class="mb-4 text-success display-1">
      <i class="bi bi-check-circle-fill"></i> <!-- Ensure icons are available or use character/img -->
      &#10004;
    </div>
    <h2 class="mb-3">¡Pedido Confirmado!</h2>
    <p class="text-muted mb-4">Tu pedido ha sido procesado exitosamente.<br>Recibirás un email de confirmación con los detalles.</p>
    <p class="small text-muted">Redirigiendo a tus pedidos...</p>
  </div>

  <div *ngIf="!loading && !success" class="py-5">
     <div class="mb-4 text-danger display-1">
      &#10006;
    </div>
    <h2 class="mb-3">Error en el Pago</h2>
    <p class="text-muted mb-4">Hubo un problema al procesar tu pago.</p>
    <button class="btn btn-primary" (click)="retry()">Volver al Checkout</button>
  </div>
</div>
