<div class="container py-5">
    <h2 class="mb-5 text-center fw-light">Finalizar Compra</h2>

    <div class="row g-5">
        <div class="col-md-5 order-md-last">
            <app-order-summary [subtotal]="cart?.subtotal || 0" [shippingCost]="cart?.shippingCost || 0"
                [total]="cart?.total || 0" [items]="cart?.items || []" [showItems]="true" [hideButtons]="true">
            </app-order-summary>
        </div>

        <div class="col-md-7">
            <!-- Stepper Indicators -->
            <div class="d-flex justify-content-center mb-5">
                <div class="d-flex align-items-center">
                    <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-white fs-5"
                        [ngClass]="{'bg-primary': currentStep >= 1, 'bg-secondary': currentStep < 1}"
                        style="width: 40px; height: 40px;">1</div>
                    <span class="ms-2 fw-semibold" [ngClass]="{'text-primary': currentStep >= 1}">Envío</span>
                </div>
                <div class="mx-3 border-top" style="width: 50px;"></div>
                <div class="d-flex align-items-center">
                    <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-white fs-5"
                        [ngClass]="{'bg-primary': currentStep >= 2, 'bg-secondary': currentStep < 2}"
                        style="width: 40px; height: 40px;">2</div>
                    <span class="ms-2 fw-semibold" [ngClass]="{'text-primary': currentStep >= 2}">Pago</span>
                </div>
            </div>

            <!-- Step 1: Address -->
            <div *ngIf="currentStep === 1">
                <h4 class="mb-3">Dirección de Envío</h4>
                <form [formGroup]="checkoutForm" (ngSubmit)="proceedToPayment()">
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="address" class="form-label">Dirección</label>
                            <input type="text" class="form-control" id="address" formControlName="address"
                                placeholder="Av. Principal 123">
                            <div *ngIf="f['address'].touched && f['address'].errors" class="text-danger small">
                                La dirección es requerida.
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="city" class="form-label">Ciudad</label>
                            <input type="text" class="form-control" id="city" formControlName="city">
                            <div *ngIf="f['city'].touched && f['city'].errors" class="text-danger small">
                                La ciudad es requerida.
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="province" class="form-label">Provincia</label>
                            <input type="text" class="form-control" id="province" formControlName="province">
                            <div *ngIf="f['province'].touched && f['province'].errors" class="text-danger small">
                                La provincia es requerida.
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="zip" class="form-label">Código Postal</label>
                            <input type="text" class="form-control" id="zip" formControlName="zipCode">
                            <div *ngIf="f['zipCode'].touched && f['zipCode'].errors" class="text-danger small">
                                El código postal es requerido.
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="country" class="form-label">País</label>
                            <input type="text" class="form-control" id="country" formControlName="country" readonly>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <button type="button" class="btn btn-outline-secondary" routerLink="/cart">Cancelar</button>
                        <button type="submit" class="btn btn-primary px-4" [disabled]="checkoutForm.invalid">
                            Continuar al Pago
                        </button>
                    </div>
                </form>
            </div>

            <!-- Step 2: Payment -->
            <div *ngIf="currentStep === 2">
                <h4 class="mb-3">Método de Pago</h4>

                <div class="card mb-4 border-primary">
                    <div class="card-body d-flex align-items-center">
                        <div class="fs-2 me-3 text-primary"><i class="bi bi-paypal"></i></div>
                        <!-- Assuming bootstrap icons or similar -->
                        <div>
                            <h6 class="mb-0 fw-bold">PayPal</h6>
                            <small class="text-muted">Pago rápido y seguro</small>
                        </div>
                    </div>
                </div>

                <div class="alert alert-light border">
                    <small>Nota: Esta es una simulación. No se procesará ningún pago real (sandbox).</small>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <button type="button" class="btn btn-outline-secondary" (click)="goBack()">Volver</button>
                    <button type="button" class="btn btn-primary px-4" (click)="confirmOrder()" [disabled]="loading">
                        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"
                            aria-hidden="true"></span>
                        Confirmar Pedido
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
