<div class="container py-5">
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="fw-bold mb-0">Carrito de Compras</h2>
        </div>
    </div>

    <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>

    <div *ngIf="!loading && isEmpty" class="text-center py-5 fade-in">
        <div class="empty-state container-fluid">
            <div class="icon-container mb-4">
                <i class="fa fa-shopping-cart fa-4x text-muted opacity-50"></i>
            </div>
            <h3 class="fw-bold mb-3">Tu carrito está vacío</h3>
            <p class="text-muted mb-4">¡Descubre nuestros increíbles productos deportivos!</p>
            <button class="btn btn-primary btn-lg px-5 pill-btn" (click)="continueShopping()">
                Continuar Comprando
            </button>
        </div>
    </div>

    <div *ngIf="!loading && !isEmpty && cart" class="row">
        <!-- Lista de Items -->
        <div class="col-lg-8">
            <div class="cart-items">
                <app-cart-item *ngFor="let item of cart.items" [item]="item"
                    (quantityChange)="updateQuantity(item, $event)" (remove)="removeItem(item)">
                </app-cart-item>
            </div>
        </div>

        <!-- Resumen -->
        <div class="col-lg-4">
            <app-order-summary [subtotal]="cart.subtotal" [shippingCost]="cart.shippingCost" [total]="cart.total"
                (proceedCheckout)="proceedToPayment()" (continueShopping)="continueShopping()">
            </app-order-summary>
        </div>
    </div>
</div>
