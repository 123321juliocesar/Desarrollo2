<div class="login-container d-flex justify-content-center align-items-center">
  <div class="login-card shadow p-4">

    <div class="text-center mb-3">
      <img src="assets/atelier.png" width="90" alt="Logo">
      <h2 class="fw-bold mt-2 title-brand">
        Atelier<span class="text-primary">Mode</span>
      </h2>
      <p class="text-muted">Bienvenido de nuevo</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="login()">

      <div class="mb-3">
        <label class="form-label fw-semibold">Correo Electrónico</label>
        <input type="email" formControlName="email" class="form-control input-custom">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Contraseña</label>
        <input type="password" formControlName="password" class="form-control input-custom">
      </div>

      <div class="d-flex justify-content-between mb-2">
        <div>
          <input type="checkbox"> Recordarme
        </div>
        <a href="#" class="text-decoration-none small text-primary">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>

      <div class="text-center mt-3 text-muted">o continúa con</div>

      <div class="d-flex gap-2 mt-2">
        <button class="btn btn-outline-dark w-50">
          <i class="bi bi-google"></i> Google
        </button>
        <button class="btn btn-outline-primary w-50">
          <i class="bi bi-facebook"></i> Facebook
        </button>
      </div>

    </form>

    <div class="text-center mt-3">
      <a href="#" class="text-decoration-none text-primary">¿Olvidaste tu contraseña?</a>
      <br>
      <a href="register" class="text-decoration-none fw-semibold text-primary">Crear una cuenta</a>
    </div>


  </div>
</div>
