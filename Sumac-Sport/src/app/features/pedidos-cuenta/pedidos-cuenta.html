<div class="orders-container">
    <div class="orders-header">
        <h1>Mis Pedidos</h1>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="loading-container">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando pedidos...</span>
        </div>
        <p class="mt-3 text-muted">Cargando tus pedidos...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="!loading && error" class="alert alert-danger" role="alert">
        {{ error }}
        <button class="btn btn-sm btn-outline-danger ms-3" (click)="loadOrders()">Reintentar</button>
    </div>

    <!-- Empty State -->
    <app-empty-orders *ngIf="!loading && !error && orders.length === 0"></app-empty-orders>

    <!-- Orders List -->
    <div *ngIf="!loading && !error && orders.length > 0" class="orders-list">
        <app-order-card *ngFor="let order of orders" [order]="order" (viewDetails)="onViewOrderDetails($event)">
        </app-order-card>
    </div>
</div>
