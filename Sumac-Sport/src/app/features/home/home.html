<!-- Header del catálogo -->
<div class="catalog-header">
  <h2>Catálogo de Ropa deportiva</h2>
  <p *ngIf="listarProductos.length > 0">
    <span class="count-badge">{{ listarProductos.length }}</span> productos listos para ti
  </p>
</div>

<div class="home-container">
  <main class="products-main">
    <div class="productos-container">
      <app-product-card
        *ngFor="let producto of listarProductos"
        [product]="producto"
        (productClick)="onProductClick($event)"
        (addToCart)="onAddToCart($event)">
      </app-product-card>
    </div>

    <div *ngIf="listarProductos.length === 0" class="no-products">
      <p>No se encontraron productos en esta categoría.</p>
    </div>
  </main>
</div>
