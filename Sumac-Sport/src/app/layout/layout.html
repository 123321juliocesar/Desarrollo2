<div class="logo-container">

  <div class="logo-box">
    <img src="assets/atelier.png" alt="logo">
  </div>
  <span class="brand-name">AtelierMode</span>
  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="search" placeholder="Buscar..." (input)="onSearch($event)"
      (keypress)="onSearchKeyPress($event)">
  </div>

  <!-- Cart Icon -->
  <div class="carrito position-relative me-3" (click)="router.navigate(['/carrito'])">
    <i class="fa fa-shopping-cart fa-lg"></i>
    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
      *ngIf="(authService.currentUser | async) && (cartCount$ | async) as count" [class.d-none]="count === 0">
      {{ count }}
    </span>
  </div>

  <!-- User Section (Right of Cart) -->
  <div class="user-section">

    <!-- IF LOGGED IN: User Icon with Dropdown -->
    <div class="user-dropdown" *ngIf="authService.currentUser | async as user" (click)="toggleUserDropdown($event)">
      <i class="fa-solid fa-user"></i>
      <span class="user-name ms-2">{{ user.firstName }}</span>
      <div class="dropdown-menu-custom" *ngIf="isUserDropdownOpen">
        <div class="dropdown-item-custom" (click)="navigateToProfile($event)">
          <i class="fa-solid fa-user-circle"></i>
          <span>Mi Perfil</span>
        </div>
        <div class="dropdown-item-custom" (click)="logout($event)">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Cerrar Sesión</span>
        </div>
      </div>
    </div>

    <!-- IF LOGGED OUT: Login Button -->
    <div class="login-btn-wrapper" *ngIf="!(authService.currentUser | async)">
      <button class="btn-login-header" (click)="router.navigate(['/login'])">
        Iniciar Sesión
      </button>
    </div>

  </div>

</div>


<app-navbar></app-navbar>

<div class="container mt-3">
  <router-outlet></router-outlet>
</div>

<!-- Product Detail Modal Overlay -->
<div class="modal-overlay" *ngIf="isModalOpen$ | async" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="closeModal()">×</button>
    <app-product-detail *ngIf="modalProductId$ | async as productId" [productId]="productId" [isModal]="true"
      (closeModal)="closeModal()">
    </app-product-detail>
  </div>
</div>
