<div class="productos-container">
  <button (click)="irCrearProducto()">
    ➕ Crear Producto
  </button>
  <button (click)="irCrearCategoria()">
    ➕ Agregar Categoría
  </button>
  <button (click)="irCrearMarca()">
    ➕ Agregar Marca
  </button>
  <div class="productos-header">
    <h2>📦 Lista de Productos</h2>
  </div>

  <p *ngIf="productos.length === 0" class="sin-productos">
    No hay productos registrados
  </p>

  <table class="productos-tabla" *ngIf="productos.length > 0">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Activo</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let producto of productos">
        <td>{{ producto.name }}</td>
        <td>S/ {{ producto.price }}</td>


        <td>
          <label class="toggle-switch">
            <input type="checkbox" [checked]="producto.status === 'active'" (change)="toggleEstado(producto)">
            <span class="toggle-slider"></span>
          </label>
        </td>

        <!-- Acciones -->
        <td class="acciones">
          <button class="btn-editar" (click)="editarProducto(producto.idProduct)">
            Editar
          </button>

          <button class="btn-eliminar" (click)="eliminarProducto(producto.idProduct)">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>

</div>



<!-- PARA LA EDICIÓN DEL PRODUCTO XD -->
<div class="modal-overlay" *ngIf="showModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Editar Producto</h2>
      <button class="close-btn" (click)="cerrarModal()">×</button>
    </div>

    <div class="modal-body">
      <!-- Campos del Producto -->
      <div class="form-row">
        <div class="form-group half">
          <label>Categoría</label>
          <select [(ngModel)]="selectedProduct.idCategory">
            <option *ngFor="let c of ListarCategorias" [value]="c.idCategory">{{c.name}}</option>
          </select>
        </div>
        <div class="form-group half">
          <label>Marca</label>
          <select [(ngModel)]="selectedProduct.idBrand">
            <option *ngFor="let m of ListarMarcas" [value]="m.idBrand">{{m.name}}</option>
          </select>
        </div>
      </div>

      <input type="text" [(ngModel)]="selectedProduct.name" placeholder="Nombre">
      <textarea [(ngModel)]="selectedProduct.description" placeholder="Descripción"></textarea>

      <div class="form-row">
        <input type="number" [(ngModel)]="selectedProduct.price" placeholder="Precio">
        <input type="number" [(ngModel)]="selectedProduct.oldPrice" placeholder="Precio Anterior">
      </div>

      <label class="file-label">
        Cambiar Imagen
        <input type="file" (change)="subirImagen($event)" hidden>
      </label>
      <img *ngIf="selectedProduct.imageUrl" [src]="selectedProduct.imageUrl" class="preview">

      <hr class="separator">

      <!-- GESTIÓN DE VARIANTES -->
      <h3>Variantes</h3>
      <div class="variants-generator">
        <div class="form-row">
          <div class="form-group half">
            <input type="text" [(ngModel)]="newVariant.color" placeholder="Color (ej: Rojo)">
          </div>
          <div class="form-group half color-picker-wrapper">
            <input type="color" [(ngModel)]="newVariant.colorHex">
          </div>
        </div>
        <input type="text" [(ngModel)]="newVariant.sizes" placeholder="Tallas (S, M, L)">
        <input type="number" [(ngModel)]="newVariant.stock" placeholder="Stock">
        <button class="btn-secondary" (click)="agregarVariantesEnBloque()"> Agregar Variantes </button>
      </div>

      <div class="variants-list">
        <table>
          <thead>
            <tr>
              <th>Color</th>
              <th>Talla</th>
              <th>Stock</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let v of variants; let i = index">
              <td><span class="color-dot" [style.background-color]="v.colorHex"></span> {{v.color}}</td>
              <td>{{v.size}}</td>
              <td><input type="number" [(ngModel)]="v.stock" class="small-input"></td>
              <td><button class="btn-danger-sm" (click)="eliminarVariante(i)">X</button></td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="cerrarModal()">Cancelar</button>
      <button class="btn-save" (click)="guardarEdicion()">Guardar Cambios</button>
    </div>
  </div>
</div>
